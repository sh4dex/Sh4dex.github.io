{% include base_path %}

<!-- start custom head snippets -->

<!-- Portfolio design fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css" />

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/page/profile.png" />
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/page/profile.png" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/page/profile.png" sizes="32x32" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/page/profile.png" sizes="192x192" />
<link rel="manifest" href="{{ base_path }}/images/page/manifest.json" />
<link rel="icon" href="/images/page/profile.png" />
<meta name="theme-color" content="#ffffff" />

<!-- MathJax for LaTeX math rendering -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- end custom head snippets -->
